{% set name = "tclreadline" %}
{% set version = "2.4.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/flightaware/tclreadline/archive/v{{ version }}.tar.gz
  sha256: d14b1568b6db8cd51659e3cc476a1f45da2020434ebb90b4b0defbc424f05907

build:
  number: 0
  skip: true  # [win or osx]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - make
  host:
    - tk
    - readline
  run:
    - tk
    - readline

test:
  commands:
    - test -f ${PREFIX}/include/tclreadline.h


about:
  home: https://github.com/flightaware/tclreadline
  license: BSD-3-Clause
  license_family: BSD
  license_file: COPYING
  summary: 'GNU readline for interactive tcl shells'
  doc_url: http://tclreadline.sourceforge.net/

extra:
  recipe-maintainers:
    - abretaud
